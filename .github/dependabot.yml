version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      npm:
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
